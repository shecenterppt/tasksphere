    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap');

    body, .font-sans, input, select, textarea, button {
      font-family: "Noto Sans Thai", sans-serif !important;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      letter-spacing: -0.01em;
    }

    h1, h2, h3, h4, .font-semibold, .font-bold {
      letter-spacing: -0.015em;
    }

    /* SweetAlert2 Glassmorphism Theme */
    div:where(.swal2-container) div:where(.swal2-popup) {
      background: rgba(255, 255, 255, 0.75) !important;
      backdrop-filter: blur(24px) !important;
      -webkit-backdrop-filter: blur(24px) !important;
      border: 1px solid rgba(255, 255, 255, 0.5) !important;
      box-shadow: 0 10px 40px 0 rgba(0, 0, 0, 0.1) !important;
      border-radius: 24px !important;
      padding: 2em !important;
      font-family: inherit !important;
    }
    html.dark div:where(.swal2-container) div:where(.swal2-popup) {
      background: rgba(31, 41, 55, 0.75) !important;
      border: 1px solid rgba(255, 255, 255, 0.1) !important;
    }
    
    div:where(.swal2-container) h2:where(.swal2-title) {
      color: #1D1D1F !important;
      font-weight: 700 !important;
      letter-spacing: -0.025em !important;
    }
    html.dark div:where(.swal2-container) h2:where(.swal2-title) { color: #f3f4f6 !important; }

    div:where(.swal2-container) div:where(.swal2-html-container) {
      color: #555 !important;
      font-weight: 500 !important;
    }
    html.dark div:where(.swal2-container) div:where(.swal2-html-container) { color: #d1d5db !important; }

    div:where(.swal2-container) button:where(.swal2-styled).swal2-confirm {
      background-color: #0071E3 !important;
      border-radius: 12px !important;
      font-weight: 600 !important;
      padding: 10px 24px !important;
      box-shadow: 0 4px 14px 0 rgba(0, 113, 227, 0.3) !important;
    }
    div:where(.swal2-container) button:where(.swal2-styled).swal2-cancel {
      background-color: rgba(229, 229, 234, 0.8) !important;
      color: #1D1D1F !important;
      border-radius: 12px !important;
      font-weight: 600 !important;
      padding: 10px 24px !important;
    }
    html.dark div:where(.swal2-container) button:where(.swal2-styled).swal2-cancel {
      background-color: rgba(75, 85, 99, 0.8) !important;
      color: #f3f4f6 !important;
    }
    .swal2-icon.swal2-success { border-color: #34c759 !important; color: #34c759 !important; }
    .swal2-icon.swal2-success [class^=swal2-success-line] { background-color: #34c759 !important; }
    .swal2-icon.swal2-success .swal2-success-ring { border-color: rgba(52, 199, 89, 0.3) !important; }
    .swal2-icon.swal2-error { border-color: #ff3b30 !important; color: #ff3b30 !important; }
    .swal2-icon.swal2-error [class^=swal2-x-mark-line] { background-color: #ff3b30 !important; }

    @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes blob {
      0% { transform: translate(0px, 0px) scale(1); }
      33% { transform: translate(30px, -50px) scale(1.1); }
      66% { transform: translate(-20px, 20px) scale(0.9); }
      100% { transform: translate(0px, 0px) scale(1); }
    }
    .animate-blob { animation: blob 7s infinite alternate; }
    .animation-delay-2000 { animation-delay: 2s; }
    .animation-delay-4000 { animation-delay: 4s; }
    .animate-fade-in-up { animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom); }

    function App() {
      // Preferences State
      const [lang, setLang] = useState(() => localStorage.getItem('tf_lang') || 'th');
      const [theme, setTheme] = useState(() => localStorage.getItem('tf_theme') || 'light');
      
      const t = i18n[lang] || i18n['th'];

      useEffect(() => {
        if (theme === 'dark') document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
        localStorage.setItem('tf_theme', theme);
      }, [theme]);

      useEffect(() => {
        localStorage.setItem('tf_lang', lang);
      }, [lang]);

      const [settings, setSettings] = useState(() => {
        const saved = localStorage.getItem('tf_settings');
        return saved ? JSON.parse(saved) : { sheetId: '', gasUrl: '', isConnected: false };
      });
      const [user, setUser] = useState(() => {
        const saved = sessionStorage.getItem('tf_user');
        return saved ? JSON.parse(saved) : null;
      });

      const [view, setView] = useState('dashboard');
      const [isLoading, setIsLoading] = useState(false);
      const [isSidebarOpen, setIsSidebarOpen] = useState(true);
      const [workspaces, setWorkspaces] = useState([]);
      const [tasks, setTasks] = useState([]);
      const [usersList, setUsersList] = useState([]); // Fetch users for everyone to assign subtasks

      const [username, setUsername] = useState('');
      const [password, setPassword] = useState('');
      const [loginError, setLoginError] = useState('');
      
      // Task Form State
      const [showTaskForm, setShowTaskForm] = useState(false);
      const [isEditing, setIsEditing] = useState(false);
      const [newTask, setNewTask] = useState({ title: '', description: '', status: 'To Do', workspace_id: '', due_date: '', subtasks: [] });
      
      const [newUser, setNewUser] = useState({ username: '', password: '', name: '', role: 'user' });
      const [showWorkspaceForm, setShowWorkspaceForm] = useState(false);
      const [newWorkspaceName, setNewWorkspaceName] = useState('');

      const apiCall = async (action, payload = {}) => {
        if (!settings.gasUrl) throw new Error("Google Apps Script URL is not configured");
        try {
          const response = await fetch(settings.gasUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' }, 
            body: JSON.stringify({ action, sheetId: settings.sheetId, ...payload }),
          });
          return await response.json();
        } catch (error) {
          throw new Error("เกิดข้อผิดพลาดในการเชื่อมต่อเซิร์ฟเวอร์");
        }
      };

      const loadData = async () => {
        if (!settings.isConnected || !user) return;
        setIsLoading(true);
        try {
          const promises = [
            apiCall('getWorkspaces').catch(() => ({ status: 'error' })),
            apiCall('getTasks').catch(() => ({ status: 'error' })),
            apiCall('getUsers').catch(() => ({ status: 'error' })) // Fetch users for dropdown assignees
          ];

          const results = await Promise.all(promises);
          if (results[0] && results[0].status === 'success') setWorkspaces(results[0].data);
          if (results[2] && results[2].status === 'success') setUsersList(results[2].data);

          if (results[1] && results[1].status === 'success') {
            const today = new Date().toISOString().split('T')[0];
            const processedTasks = results[1].data.map(task => {
              // Parse subtasks JSON
              let parsedSubtasks = [];
              try {
                parsedSubtasks = typeof task.subtasks === 'string' ? JSON.parse(task.subtasks) : (task.subtasks || []);
              } catch(e) {}

              const updatedTask = { ...task, subtasks: parsedSubtasks };
              if (task.status !== 'Done' && task.due_date && task.due_date < today) {
                 updatedTask.status = 'Overdue';
              }
              return updatedTask;
            });
            setTasks(processedTasks);
          }
        } catch (error) {
          console.error(error);
        } finally {
          setIsLoading(false);
        }
      };

      useEffect(() => { loadData(); }, [user, settings.isConnected]);

      // Calculate Progress Logic
      const calculateProgress = (subtasks) => {
        if (!subtasks || subtasks.length === 0) return null;
        const doneCount = subtasks.filter(s => s.status === 'Done').length;
        return Math.round((doneCount / subtasks.length) * 100);
      };

      const handleLogin = async (e) => {
        e.preventDefault();
        setIsLoading(true);
        setLoginError('');

        if (!settings.isConnected) {
          setLoginError(t.dbWarningDesc);
          setIsLoading(false);
          return;
        }

        try {
          const res = await apiCall('login', { username, password });
          if (res.status === 'success') {
            setUser(res.data);
            sessionStorage.setItem('tf_user', JSON.stringify(res.data));
            setView('dashboard');
          } else {
            setLoginError(res.message || 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง');
          }
        } catch (err) {
          setLoginError(err.message);
        }
        setIsLoading(false);
      };

      const handleLogout = () => {
        setUser(null); setUsername(''); setPassword('');
        sessionStorage.removeItem('tf_user'); setView('dashboard');
      };

      const handleConnectSettings = async () => {
        setIsLoading(true);
        try {
          const response = await fetch(settings.gasUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'setup', sheetId: settings.sheetId }),
          });
          const data = await response.json();
          if (data.status === 'success') {
            const newSettings = { ...settings, isConnected: true };
            setSettings(newSettings); localStorage.setItem('tf_settings', JSON.stringify(newSettings));
            loadData(); Swal.fire(t.success, 'เชื่อมต่อฐานข้อมูลและตั้งค่าระบบสำเร็จ', 'success'); setView('dashboard');
          } else Swal.fire(t.fail, data.message, 'error');
        } catch (e) {
           Swal.fire(t.fail, 'ไม่สามารถเชื่อมต่อได้', 'error');
        } finally { setIsLoading(false); }
      };

      const handleCreateUser = async (e) => {
        e.preventDefault();
        const userToSave = { ...newUser };
        const tempUser = { ...userToSave, id: 'temp_u_' + Date.now() };
        setUsersList(prev => [...prev, tempUser]);
        setNewUser({ username: '', password: '', name: '', role: 'user' });

        try {
          const res = await apiCall('createUser', { data: userToSave });
          if (res.status === 'success') {
            Swal.fire({ icon: 'success', title: t.success, text: 'เพิ่มผู้ใช้งานสำเร็จ', timer: 1500, showConfirmButton: false, toast: true, position: 'top-end' });
          } else {
            Swal.fire(t.fail, res.message, 'error');
            setUsersList(prev => prev.filter(u => u.username !== tempUser.username));
          }
        } catch (e) { setUsersList(prev => prev.filter(u => u.username !== tempUser.username)); }
      };

      const handleCreateWorkspace = async (e) => {
        e.preventDefault();
        const tempId = 'temp_ws_' + Date.now();
        const newWs = { id: tempId, name: newWorkspaceName, created_by: user.username };
        setWorkspaces(prev => [...prev, newWs]);
        setShowWorkspaceForm(false); setNewWorkspaceName('');

        try {
          const res = await apiCall('createWorkspace', { data: { name: newWs.name, created_by: newWs.created_by } });
          if (res.status === 'success') {
            setWorkspaces(prev => prev.map(w => w.id === tempId ? { ...w, id: res.data.id } : w));
            Swal.fire({ icon: 'success', title: t.success, text: 'สร้าง Workspace สำเร็จ', timer: 1500, showConfirmButton: false, toast: true, position: 'top-end' });
          } else { setWorkspaces(prev => prev.filter(w => w.id !== tempId)); }
        } catch (e) { setWorkspaces(prev => prev.filter(w => w.id !== tempId)); }
      };

      // --- Task & Subtask Handling ---
      const handleAddSubtaskForm = () => {
        setNewTask(prev => ({
          ...prev, 
          subtasks: [...(prev.subtasks || []), { id: 'st_' + Date.now(), title: '', assignee: user.username, status: 'To Do' }]
        }));
      };

      const handleSubtaskChange = (id, field, value) => {
        setNewTask(prev => ({
          ...prev,
          subtasks: prev.subtasks.map(st => st.id === id ? { ...st, [field]: value } : st)
        }));
      };

      const handleRemoveSubtaskForm = (id) => {
        setNewTask(prev => ({ ...prev, subtasks: prev.subtasks.filter(st => st.id !== id) }));
      };

      const handleSaveTask = async (e) => {
        e.preventDefault();
        if (!newTask.title) return;
        
        const tempId = isEditing ? newTask.id : 'temp_t_' + Date.now();
        const taskDataToSave = {
          title: newTask.title,
          description: newTask.description,
          status: newTask.status || 'To Do',
          workspace_id: newTask.workspace_id || (workspaces[0]?.id || ''),
          due_date: newTask.due_date,
          assignee: newTask.assignee || user.username,
          subtasks: JSON.stringify(newTask.subtasks || [])
        };

        const taskDataForUI = { ...taskDataToSave, id: tempId, subtasks: newTask.subtasks || [] };
        
        // Optimistic Update
        const prevTasks = [...tasks];
        if (isEditing) {
          setTasks(prevTasks.map(t => t.id === tempId ? taskDataForUI : t));
        } else {
          setTasks([taskDataForUI, ...prevTasks]);
        }
        
        setShowTaskForm(false);
        setIsEditing(false);
        
        try {
          const action = isEditing ? 'updateTask' : 'createTask';
          const payload = isEditing ? { taskId: tempId, data: taskDataToSave } : { data: taskDataToSave };
          
          const res = await apiCall(action, payload);
          if (res.status === 'success') {
             if(!isEditing) setTasks(prev => prev.map(t => t.id === tempId ? { ...t, id: res.data.id } : t));
             Swal.fire({ icon: 'success', title: t.success, text: t.saveTask, timer: 1500, showConfirmButton: false, toast: true, position: 'top-end' });
          } else {
             Swal.fire(t.fail, 'ไม่สามารถบันทึกงานได้', 'error');
             setTasks(prevTasks);
          }
        } catch (e) {
          Swal.fire(t.fail, e.message, 'error');
          setTasks(prevTasks);
        }
      };

      const openEditTask = (task) => {
        setNewTask({ ...task });
        setIsEditing(true);
        setShowTaskForm(true);
      };

      const toggleTaskStatus = async (id, currentStatus) => {
        const nextStatusMap = { 'To Do': 'Doing', 'Doing': 'Done', 'Done': 'To Do', 'Overdue': 'Doing' };
        const nextStatus = nextStatusMap[currentStatus] || 'To Do';
        setTasks(tasks.map(t => t.id === id ? { ...t, status: nextStatus } : t));
        try { await apiCall('updateTask', { taskId: id, data: { status: nextStatus } }); } catch (e) {}
      };

      const toggleSubtaskStatusCard = async (taskId, subtaskId) => {
        const task = tasks.find(t => t.id === taskId);
        if(!task) return;

        const updatedSubtasks = task.subtasks.map(st => st.id === subtaskId ? { ...st, status: st.status === 'Done' ? 'To Do' : 'Done' } : st);
        setTasks(tasks.map(t => t.id === taskId ? { ...t, subtasks: updatedSubtasks } : t));
        
        try { await apiCall('updateTask', { taskId: taskId, data: { subtasks: JSON.stringify(updatedSubtasks) } }); } catch(e){}
      };

      const handleDeleteTask = async (id) => {
        const result = await Swal.fire({
          title: t.confirmDeleteTitle, text: t.confirmDeleteText, icon: 'warning',
          showCancelButton: true, confirmButtonColor: '#ff3b30', cancelButtonColor: 'rgba(229, 229, 234, 0.8)',
          confirmButtonText: t.deleteConfirmBtn, cancelButtonText: t.cancel, customClass: { cancelButton: 'text-[#1D1D1F]' }
        });
        if (!result.isConfirmed) return;
        const previousTasks = [...tasks]; setTasks(tasks.filter(t => t.id !== id));
        try {
          await apiCall('deleteTask', { taskId: id });
          Swal.fire({ icon: 'success', title: t.delSuccess, timer: 1500, showConfirmButton: false, toast: true, position: 'top-end' });
        } catch (e) { setTasks(previousTasks); }
      };

      const stats = useMemo(() => {
        const myTasks = tasks.filter(t => t.assignee === user?.username || user?.role === 'admin');
        return {
          total: myTasks.length,
          done: myTasks.filter(t => t.status === 'Done').length,
          pending: myTasks.filter(t => t.status === 'To Do' || t.status === 'Doing').length,
          overdue: myTasks.filter(t => t.status === 'Overdue').length,
        };
      }, [tasks, user]);


      if (!user) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4 font-sans relative">
            <GlassCard className="w-full max-w-md p-8 animate-fade-in-up">
              <div className="text-center mb-8">
                <div className="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-blue-500 to-blue-400 text-white shadow-lg mb-4">
                  <Icons.CheckSquare />
                </div>
                <h1 className="text-3xl font-semibold tracking-tight">TaskSphere</h1>
                <p className="text-gray-500 dark:text-gray-400 mt-2">Smart Workspace Collaboration</p>
              </div>
              
              <form onSubmit={handleLogin} className="space-y-5">
                <div>
                  <label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">{t.username}</label>
                  <input 
                    type="text" required
                    className="w-full px-4 py-3 rounded-xl bg-gray-50/50 dark:bg-gray-800/80 border border-gray-200 dark:border-gray-700 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition-all font-sans text-gray-900 dark:text-white placeholder-gray-400"
                    placeholder={t.usernamePh}
                    value={username} onChange={(e) => setUsername(e.target.value)}
                  />
                </div>
                <div>
                  <label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">{t.password}</label>
                  <input 
                    type="password" required
                    className="w-full px-4 py-3 rounded-xl bg-gray-50/50 dark:bg-gray-800/80 border border-gray-200 dark:border-gray-700 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition-all font-sans text-gray-900 dark:text-white placeholder-gray-400"
                    placeholder={t.passwordPh}
                    value={password} onChange={(e) => setPassword(e.target.value)}
                  />
                </div>
                {loginError && <p className="text-red-500 text-sm font-medium text-center">{loginError}</p>}
                <button 
                  type="submit" disabled={isLoading}
                  className={`w-full py-3 rounded-xl font-medium transition-all shadow-md shadow-blue-500/20 text-white ${isLoading ? 'bg-blue-400 cursor-not-allowed' : 'bg-[#0071E3] hover:bg-blue-600 active:scale-95'}`}
                >
                  {isLoading ? t.checking : t.login}
                </button>
              </form>
            </GlassCard>
          </div>
        );
      }

      return (
        <div className="min-h-screen flex font-sans selection:bg-blue-200 relative overflow-hidden">
          
          {/* Background Blobs */}
          <div className="fixed inset-0 z-0 pointer-events-none">
            <div className="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-blue-400/20 mix-blend-multiply filter blur-[100px] animate-blob"></div>
            <div className="absolute top-[20%] right-[-10%] w-[35%] h-[35%] rounded-full bg-purple-400/20 mix-blend-multiply filter blur-[100px] animate-blob animation-delay-2000"></div>
            <div className="absolute bottom-[-20%] left-[20%] w-[40%] h-[40%] rounded-full bg-cyan-400/20 mix-blend-multiply filter blur-[100px] animate-blob animation-delay-4000"></div>
          </div>

          {isLoading && (
            <div className="fixed inset-0 bg-white/50 dark:bg-gray-900/50 backdrop-blur-sm z-50 flex items-center justify-center">
               <div className="w-12 h-12 border-4 border-blue-200 border-t-blue-500 rounded-full animate-spin"></div>
            </div>
          )}

          {/* Desktop Sidebar */}
          <aside className={`hidden md:flex flex-col fixed inset-y-0 left-0 bg-white/40 dark:bg-gray-800/40 backdrop-blur-2xl border-r border-white/60 dark:border-gray-700/50 z-20 pt-8 pb-4 transition-all duration-300 ease-in-out ${isSidebarOpen ? 'w-64 px-4' : 'w-20 px-2'}`}>
            <button 
              onClick={() => setIsSidebarOpen(!isSidebarOpen)}
              className="absolute -right-3.5 top-10 w-7 h-7 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-full flex items-center justify-center shadow-sm text-gray-500 hover:text-blue-500 hover:border-blue-300 transition-colors z-30"
            >
              {isSidebarOpen ? <Icons.ChevronLeft /> : <Icons.ChevronRight />}
            </button>

            <div className={`flex items-center gap-3 mb-10 ${isSidebarOpen ? 'px-2' : 'justify-center'}`}>
              <div className="w-8 h-8 rounded-lg bg-blue-500 text-white flex items-center justify-center shrink-0">
                 <Icons.CheckSquare />
              </div>
              {isSidebarOpen && <span className="font-semibold text-xl tracking-tight whitespace-nowrap overflow-hidden transition-opacity duration-300">TaskSphere</span>}
            </div>

            <nav className="flex-1 space-y-2">
              {[
                { id: 'dashboard', label: t.dashboard, icon: Icons.Home },
                { id: 'tasks', label: t.myTasks, icon: Icons.CheckSquare },
                { id: 'workspaces', label: t.workspaces, icon: Icons.Folder },
                ...(user.role === 'admin' ? [
                  { id: 'users', label: t.manageUsers, icon: Icons.UserGroup },
                  { id: 'settings', label: t.sysSettings, icon: Icons.Settings }
                ] : [])
              ].map(item => (
                <button
                  key={item.id}
                  onClick={() => setView(item.id)}
                  title={!isSidebarOpen ? item.label : ''}
                  className={`w-full flex items-center ${isSidebarOpen ? 'gap-3 px-4' : 'justify-center'} py-3 rounded-xl transition-all ${view === item.id ? 'bg-white dark:bg-gray-800 shadow-sm font-semibold text-blue-600 dark:text-blue-400' : 'text-gray-600 dark:text-gray-400 font-medium hover:bg-white/60 dark:hover:bg-gray-800/60'}`}
                >
                  <div className="shrink-0"><item.icon /></div>
                  {isSidebarOpen && <span className="whitespace-nowrap overflow-hidden">{item.label}</span>}
                </button>
              ))}
            </nav>

            <div className="mt-auto">
              <GlassCard className={`p-2 flex items-center gap-3 mb-2 bg-white/40 dark:bg-gray-800/40 border-none shadow-none ${isSidebarOpen ? 'px-4' : 'justify-center'}`}>
                <div className="w-10 h-10 rounded-full bg-gradient-to-br from-blue-100 to-blue-200 flex items-center justify-center text-blue-700 font-bold uppercase shrink-0">
                  {user.name.charAt(0)}
                </div>
                {isSidebarOpen && (
                  <div className="flex-1 min-w-0">
                    <p className="text-sm font-semibold truncate dark:text-gray-200">{user.name}</p>
                    <p className="text-xs text-gray-500 dark:text-gray-400 capitalize">{user.role}</p>
                  </div>
                )}
              </GlassCard>
              <button 
                onClick={handleLogout} 
                title={!isSidebarOpen ? t.logout : ''}
                className={`w-full flex items-center ${isSidebarOpen ? 'justify-center gap-2 px-4' : 'justify-center'} py-2 text-sm font-medium text-red-500 hover:bg-red-50 dark:hover:bg-red-900/30 rounded-lg transition-colors`}
              >
                <div className="shrink-0"><Icons.LogOut /></div> 
                {isSidebarOpen && <span>{t.logout}</span>}
              </button>
            </div>
          </aside>

          {/* Main Content */}
          <main className={`flex-1 pb-20 md:pb-0 min-h-screen relative overflow-y-auto transition-all duration-300 ease-in-out z-10 ${isSidebarOpen ? 'md:ml-64' : 'md:ml-20'}`}>
            <div className="absolute top-0 inset-x-0 h-64 bg-gradient-to-b from-white/40 dark:from-gray-800/40 to-transparent -z-10 pointer-events-none" />

            <div className="p-6 md:p-10 max-w-5xl mx-auto space-y-8 animate-fade-in">
              <header className="flex flex-col md:flex-row md:justify-between md:items-end gap-4">
                <div>
                  <h1 className="text-3xl md:text-4xl font-bold tracking-tight">
                    {view === 'dashboard' && `${t.welcome}, ${user.name}`}
                    {view === 'tasks' && t.allTasks}
                    {view === 'workspaces' && t.workspaces}
                    {view === 'users' && t.manageUsers}
                    {view === 'settings' && t.sysSettings}
                  </h1>
                  <p className="text-gray-500 dark:text-gray-400 mt-2 font-medium">
                    {view === 'dashboard' && t.overview}
                    {view === 'users' && t.setupMsg}
                    {view === 'settings' && t.setupMsg2}
                  </p>
                </div>
                
                <div className="flex flex-wrap items-center gap-2 md:gap-3">
                  <button onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')} className="p-2.5 bg-white/50 dark:bg-gray-800/50 border border-white/60 dark:border-gray-700/50 rounded-full shadow-sm backdrop-blur-md transition-all text-gray-500 dark:text-gray-400 hover:text-blue-600 dark:hover:text-blue-400 hover:bg-white dark:hover:bg-gray-700 focus:outline-none">
                    {theme === 'dark' ? <Icons.Sun /> : <Icons.Moon />}
                  </button>

                  <button onClick={() => setLang(lang === 'th' ? 'en' : 'th')} className="relative inline-flex items-center w-[60px] h-10 rounded-full bg-white/50 dark:bg-gray-800/50 border border-white/60 dark:border-gray-700/50 shadow-sm backdrop-blur-md transition-all px-1 focus:outline-none">
                    <span className={`absolute text-[10px] font-bold transition-opacity ${lang === 'en' ? 'right-2.5 text-gray-500 dark:text-gray-400' : 'left-2.5 text-gray-500 dark:text-gray-400'}`}>{lang === 'th' ? 'EN' : 'TH'}</span>
                    <span className={`inline-flex items-center justify-center w-8 h-8 transform bg-white dark:bg-gray-700 rounded-full transition-transform duration-300 shadow-sm border border-gray-100 dark:border-gray-600 ${lang === 'th' ? 'translate-x-0' : 'translate-x-5'}`}>
                      <span className="text-[10px] font-bold text-[#0071E3] dark:text-blue-400">{lang.toUpperCase()}</span>
                    </span>
                  </button>

                  <button onClick={loadData} disabled={isLoading} className={`p-2.5 bg-white/50 dark:bg-gray-800/50 border border-white/60 dark:border-gray-700/50 rounded-full shadow-sm backdrop-blur-md transition-all flex items-center justify-center ${isLoading ? 'text-blue-400 cursor-not-allowed opacity-70' : 'text-gray-500 dark:text-gray-400 hover:text-blue-600 hover:bg-white dark:hover:bg-gray-700'}`}>
                    <div className={isLoading ? "animate-spin" : ""}><Icons.Refresh /></div>
                  </button>
                  
                  {view === 'tasks' && settings.isConnected && (
                    <button onClick={() => { setNewTask({ title: '', description: '', status: 'To Do', workspace_id: workspaces[0]?.id || '', due_date: '', subtasks: [] }); setIsEditing(false); setShowTaskForm(true); }} className="hidden md:flex items-center gap-2 px-4 py-2.5 bg-[#0071E3] text-white rounded-full hover:bg-blue-600 transition-all shadow-sm font-medium active:scale-95">
                      <Icons.Plus /> {t.newTask}
                    </button>
                  )}
                </div>
              </header>

              {user.role === 'admin' && !settings.isConnected && view !== 'settings' && (
                <div className="bg-yellow-50 dark:bg-yellow-900/30 border border-yellow-200 dark:border-yellow-700/50 text-yellow-800 dark:text-yellow-200 p-4 rounded-xl flex items-center justify-between shadow-sm">
                  <div className="flex items-center gap-3">
                    <span className="text-xl">⚠️</span>
                    <div>
                      <p className="font-semibold">{t.dbWarning}</p>
                      <p className="text-sm opacity-80">{t.dbWarningDesc}</p>
                    </div>
                  </div>
                  <button onClick={() => setView('settings')} className="px-4 py-2 bg-yellow-200 dark:bg-yellow-600 hover:bg-yellow-300 dark:hover:bg-yellow-500 dark:text-white rounded-lg text-sm font-semibold transition-colors">
                    {t.setupNow}
                  </button>
                </div>
              )}

              {view === 'dashboard' && (
                <div className="space-y-8">
                  <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                    {[
                      { label: t.total, value: stats.total, color: 'text-blue-600 dark:text-blue-400', bg: 'bg-blue-50 dark:bg-blue-900/30' },
                      { label: t.done, value: stats.done, color: 'text-green-600 dark:text-green-400', bg: 'bg-green-50 dark:bg-green-900/30' },
                      { label: t.doing, value: stats.pending, color: 'text-orange-500 dark:text-orange-400', bg: 'bg-orange-50 dark:bg-orange-900/30' },
                      { label: t.overdue, value: stats.overdue, color: 'text-red-500 dark:text-red-400', bg: 'bg-red-50 dark:bg-red-900/30' },
                    ].map((stat, idx) => (
                      <GlassCard key={idx} className="p-6 flex flex-col items-center justify-center text-center hover:-translate-y-1 transition-transform duration-300">
                        <div className={`w-12 h-12 rounded-full ${stat.bg} ${stat.color} flex items-center justify-center mb-3`}>
                          <span className="text-2xl font-bold">{stat.value}</span>
                        </div>
                        <span className="text-sm font-medium text-gray-600 dark:text-gray-300">{stat.label}</span>
                      </GlassCard>
                    ))}
                  </div>

                  <div>
                    <div className="flex justify-between items-center mb-4">
                      <h2 className="text-xl font-bold">{t.urgentTasks}</h2>
                      <button onClick={() => setView('tasks')} className="text-blue-500 text-sm font-semibold hover:underline">{t.seeAll}</button>
                    </div>
                    <div className="space-y-3">
                      {tasks.filter(tk => tk.status !== 'Done' && (tk.assignee === user.username || user.role === 'admin')).slice(0, 3).map(task => {
                        const progress = calculateProgress(task.subtasks);
                        return (
                        <GlassCard key={task.id} className="p-4 flex flex-col gap-3 group hover:bg-white/90 dark:hover:bg-gray-800 transition-colors">
                          <div className="flex items-start justify-between">
                            <div className="flex items-start gap-4">
                              <button onClick={() => toggleTaskStatus(task.id, task.status)} className={`mt-1 w-6 h-6 rounded-full border-2 flex items-center justify-center transition-colors ${task.status === 'Done' ? 'bg-green-500 border-green-500 text-white' : task.status === 'Doing' ? 'border-orange-400 text-orange-400' : task.status === 'Overdue' ? 'border-red-500 bg-red-50 text-red-500' : 'border-gray-300 dark:border-gray-600 text-transparent hover:border-green-500'}`}>
                                <Icons.CheckSquare />
                              </button>
                              <div>
                                <h3 className={`font-semibold ${task.status === 'Done' ? 'line-through text-gray-400 dark:text-gray-500' : ''}`}>{task.title}</h3>
                                <div className="flex items-center gap-3 mt-1 text-xs">
                                   <span className={`px-2 py-0.5 rounded-full font-medium ${task.status === 'To Do' ? 'bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300' : task.status === 'Doing' ? 'bg-orange-100 dark:bg-orange-900/50 text-orange-600 dark:text-orange-400' : task.status === 'Overdue' ? 'bg-red-100 dark:bg-red-900/50 text-red-600 dark:text-red-400' : 'bg-green-100 dark:bg-green-900/50 text-green-600 dark:text-green-400'}`}>
                                      {task.status}
                                    </span>
                                    <span className="text-gray-500 dark:text-gray-400 flex items-center gap-1 font-medium">
                                      <Icons.Clock /> {task.due_date || '-'}
                                    </span>
                                </div>
                              </div>
                            </div>
                          </div>
                          {progress !== null && (
                            <div className="w-full flex items-center gap-2 pl-10">
                              <div className="flex-1 bg-gray-200 dark:bg-gray-700 rounded-full h-1.5 overflow-hidden">
                                <div className="bg-blue-500 h-1.5 rounded-full transition-all duration-500" style={{ width: `${progress}%` }}></div>
                              </div>
                              <span className="text-[10px] font-semibold text-gray-500 dark:text-gray-400 min-w-[28px]">{progress}%</span>
                            </div>
                          )}
                        </GlassCard>
                      )})}
                      {tasks.filter(tk => tk.status !== 'Done').length === 0 && settings.isConnected && (
                         <div className="text-center py-10 text-gray-400 font-medium">
                            {t.noPending}
                         </div>
                      )}
                    </div>
                  </div>
                </div>
              )}

              {view === 'tasks' && (
                 <div className="space-y-4">
                   {tasks.length === 0 && <p className="text-center text-gray-400 py-10 font-medium">{t.noTasks}</p>}
                   {tasks.map(task => {
                     const progress = calculateProgress(task.subtasks);
                     return (
                     <GlassCard key={task.id} className="p-5 flex flex-col justify-between gap-4 group">
                        <div className="flex items-start gap-4 w-full">
                            <button onClick={() => toggleTaskStatus(task.id, task.status)} className={`flex-shrink-0 w-6 h-6 rounded-full border-2 flex items-center justify-center transition-colors mt-1 ${task.status === 'Done' ? 'bg-green-500 border-green-500 text-white' : task.status === 'Doing' ? 'border-orange-400 text-orange-400' : task.status === 'Overdue' ? 'border-red-500 bg-red-50 text-red-500' : 'border-gray-300 dark:border-gray-600 text-transparent hover:border-green-500'}`}>
                               {task.status === 'Done' && <svg className="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path fillRule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clipRule="evenodd"></path></svg>}
                            </button>
                            <div className="flex-1 w-full">
                              <div className="flex justify-between items-start">
                                <h3 className={`font-semibold text-lg ${task.status === 'Done' ? 'line-through text-gray-400 dark:text-gray-500' : ''}`}>{task.title}</h3>
                                {(user.role === 'admin' || task.assignee === user.username) && (
                                  <div className="flex opacity-0 group-hover:opacity-100 transition-opacity">
                                    <button onClick={() => openEditTask(task)} className="text-gray-400 hover:text-blue-500 p-2 rounded-lg hover:bg-blue-50 dark:hover:bg-blue-900/30 transition-colors" title={t.editTask}>
                                      <Icons.Edit />
                                    </button>
                                    <button onClick={() => handleDeleteTask(task.id)} className="text-gray-400 hover:text-red-500 p-2 rounded-lg hover:bg-red-50 dark:hover:bg-red-900/30 transition-colors" title="Delete">
                                      <Icons.Trash />
                                    </button>
                                  </div>
                                )}
                              </div>
                              <p className="text-sm text-gray-500 dark:text-gray-400 mt-1 line-clamp-2 font-medium">{task.description}</p>
                              
                              {/* Progress & Subtasks */}
                              {task.subtasks && task.subtasks.length > 0 && (
                                <div className="mt-4 border border-gray-100 dark:border-gray-700/50 rounded-xl overflow-hidden bg-white/30 dark:bg-gray-800/30">
                                  <div className="bg-gray-50 dark:bg-gray-800/80 p-2 px-3 flex items-center justify-between text-xs font-semibold text-gray-500 dark:text-gray-400 border-b border-gray-100 dark:border-gray-700/50">
                                    <span>{t.subtasks} ({task.subtasks.length})</span>
                                    <span>{progress}% {t.progress}</span>
                                  </div>
                                  <div className="h-1 w-full bg-gray-200 dark:bg-gray-700">
                                    <div className="h-1 bg-blue-500 transition-all duration-500" style={{width: `${progress}%`}}></div>
                                  </div>
                                  <div className="p-2 space-y-1">
                                    {task.subtasks.map(st => (
                                      <div key={st.id} className="flex items-center gap-3 p-2 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700/50 transition-colors">
                                        <button onClick={() => toggleSubtaskStatusCard(task.id, st.id)} className={`flex-shrink-0 w-5 h-5 rounded border flex items-center justify-center transition-colors ${st.status === 'Done' ? 'bg-green-500 border-green-500 text-white' : 'border-gray-300 dark:border-gray-500 text-transparent hover:border-green-500'}`}>
                                          <Icons.CheckMini />
                                        </button>
                                        <span className={`flex-1 text-sm font-medium ${st.status === 'Done' ? 'line-through text-gray-400 dark:text-gray-500' : 'text-gray-700 dark:text-gray-200'}`}>{st.title}</span>
                                        <span className="text-[10px] font-semibold px-2 py-1 rounded bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 shrink-0">{st.assignee}</span>
                                      </div>
                                    ))}
                                  </div>
                                </div>
                              )}

                              <div className="flex flex-wrap items-center gap-2 mt-4 text-xs">
                                 <span className={`px-2 py-1 rounded-md font-medium ${task.status === 'To Do' ? 'bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300' : task.status === 'Doing' ? 'bg-orange-100 dark:bg-orange-900/50 text-orange-700 dark:text-orange-400' : task.status === 'Overdue' ? 'bg-red-100 dark:bg-red-900/50 text-red-700 dark:text-red-400 animate-pulse' : 'bg-green-100 dark:bg-green-900/50 text-green-700 dark:text-green-400'}`}>
                                    {task.status}
                                  </span>
                                  <span className="bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 px-2 py-1 rounded-md flex items-center gap-1 font-medium">
                                    <Icons.Folder /> {workspaces.find(w => w.id === task.workspace_id)?.name || 'Unknown'}
                                  </span>
                                  {task.due_date && (
                                    <span className={`flex items-center gap-1 px-2 py-1 rounded-md font-medium ${task.status === 'Overdue' ? 'bg-red-50 dark:bg-red-900/30 text-red-600 dark:text-red-400' : 'bg-gray-50 dark:bg-gray-800 text-gray-500 dark:text-gray-400'}`}>
                                      <Icons.Clock /> {task.due_date}
                                    </span>
                                  )}
                                  <span className="text-gray-400 ml-auto flex items-center gap-1 font-medium bg-gray-50 dark:bg-gray-800 px-2 py-1 rounded-md">
                                    <Icons.User /> {task.assignee}
                                  </span>
                              </div>
                            </div>
                        </div>
                     </GlassCard>
                   )})}
                 </div>
              )}

              {view === 'workspaces' && (
                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  {workspaces.length === 0 && <p className="text-gray-400 col-span-2 font-medium">{t.noWs}</p>}
                  {workspaces.map(ws => (
                     <GlassCard key={ws.id} className="p-6 hover:shadow-md transition-shadow">
                        <div className="flex items-center gap-3 mb-4">
                          <div className="w-10 h-10 rounded-xl bg-blue-100 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 flex items-center justify-center">
                            <Icons.Folder />
                          </div>
                          <h3 className="text-xl font-bold">{ws.name}</h3>
                        </div>
                        <div className="text-sm text-gray-500 dark:text-gray-400 mb-4 font-medium">
                          {t.creator}: <span className="font-semibold text-gray-700 dark:text-gray-200">{ws.created_by}</span>
                        </div>
                        <div className="flex gap-2">
                           <span className="text-xs bg-gray-100 dark:bg-gray-700 px-2 py-1 rounded-md font-medium">{tasks.filter(tk => tk.workspace_id === ws.id).length} {t.taskCount}</span>
                        </div>
                     </GlassCard>
                  ))}
                  {user.role === 'admin' && (
                    <button onClick={() => setShowWorkspaceForm(true)} className="h-full min-h-[160px] border-2 border-dashed border-gray-300 dark:border-gray-600 rounded-2xl flex flex-col items-center justify-center text-gray-500 dark:text-gray-400 hover:text-blue-500 hover:border-blue-300 dark:hover:border-blue-500 hover:bg-blue-50/50 dark:hover:bg-blue-900/20 transition-all">
                      <Icons.Plus /> <span className="mt-2 font-medium">{t.addWs}</span>
                    </button>
                  )}
                </div>
              )}

              {view === 'users' && user.role === 'admin' && (
                // ... same users code ...
                <div className="space-y-6">
                  <GlassCard className="p-6 md:p-8 max-w-2xl">
                    <h2 className="text-xl font-bold mb-6 flex items-center gap-2"><Icons.UserGroup /> {t.addUserTitle}</h2>
                    <form onSubmit={handleCreateUser} className="space-y-4">
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                          <label className="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1">{t.name}</label>
                          <input type="text" required className="w-full px-4 py-2 rounded-xl bg-white/80 dark:bg-gray-800/80 border border-gray-200 dark:border-gray-700 focus:border-blue-500 outline-none font-sans dark:text-white" value={newUser.name} onChange={e => setNewUser({...newUser, name: e.target.value})} />
                        </div>
                        <div>
                          <label className="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1">{t.role}</label>
                          <select className="w-full px-4 py-2 rounded-xl bg-white/80 dark:bg-gray-800/80 border border-gray-200 dark:border-gray-700 focus:border-blue-500 outline-none font-sans dark:text-white" value={newUser.role} onChange={e => setNewUser({...newUser, role: e.target.value})}>
                            <option value="user">{t.userRole}</option><option value="admin">{t.adminRole}</option>
                          </select>
                        </div>
                        <div>
                          <label className="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1">{t.username}</label>
                          <input type="text" required className="w-full px-4 py-2 rounded-xl bg-white/80 dark:bg-gray-800/80 border border-gray-200 dark:border-gray-700 focus:border-blue-500 outline-none font-sans dark:text-white" value={newUser.username} onChange={e => setNewUser({...newUser, username: e.target.value})} />
                        </div>
                        <div>
                          <label className="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1">{t.password}</label>
                          <input type="password" required className="w-full px-4 py-2 rounded-xl bg-white/80 dark:bg-gray-800/80 border border-gray-200 dark:border-gray-700 focus:border-blue-500 outline-none font-sans dark:text-white" value={newUser.password} onChange={e => setNewUser({...newUser, password: e.target.value})} />
                        </div>
                      </div>
                      <div className="pt-4 flex justify-end">
                        <button type="submit" disabled={isLoading} className={`px-6 py-2.5 text-white rounded-xl font-semibold transition-all shadow-sm ${isLoading ? 'bg-blue-400 cursor-not-allowed' : 'bg-[#0071E3] hover:bg-blue-600 active:scale-95'}`}>{isLoading ? t.checking : t.addUserBtn}</button>
                      </div>
                    </form>
                  </GlassCard>

                  {usersList.length > 0 && (
                    <GlassCard className="p-6 md:p-8">
                       <h2 className="text-xl font-bold mb-4">{t.userList}</h2>
                       <div className="overflow-x-auto">
                         <table className="w-full text-left border-collapse">
                           <thead>
                             <tr className="border-b border-gray-200 dark:border-gray-700 text-sm text-gray-500 dark:text-gray-400">
                               <th className="py-3 px-4 font-semibold">{t.name}</th><th className="py-3 px-4 font-semibold">{t.username}</th><th className="py-3 px-4 font-semibold">{t.role}</th>
                             </tr>
                           </thead>
                           <tbody>
                             {usersList.map((u, i) => (
                               <tr key={i} className="border-b border-gray-100 dark:border-gray-800 last:border-0 hover:bg-white/40 dark:hover:bg-gray-800/40 transition-colors">
                                 <td className="py-3 px-4 font-semibold">{u.name}</td><td className="py-3 px-4 text-gray-600 dark:text-gray-300 font-medium">{u.username}</td>
                                 <td className="py-3 px-4"><span className={`text-xs px-2 py-1 rounded-full font-medium ${u.role === 'admin' ? 'bg-purple-100 dark:bg-purple-900/30 text-purple-700 dark:text-purple-400' : 'bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-300'}`}>{u.role}</span></td>
                               </tr>
                             ))}
                           </tbody>
                         </table>
                       </div>
                    </GlassCard>
                  )}
                </div>
              )}

              {view === 'settings' && user.role === 'admin' && (
                <GlassCard className="p-8 max-w-2xl">
                  <div className="mb-8">
                    <h2 className="text-xl font-bold mb-2">{t.dbConn}</h2>
                    <p className="text-sm text-gray-500 dark:text-gray-400 font-medium">{t.dbHint}</p>
                  </div>
                  <div className="space-y-5">
                    <div>
                      <label className="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1">{t.sheetId}</label>
                      <input type="text" className="w-full px-4 py-3 rounded-xl bg-gray-50/50 dark:bg-gray-800/80 border border-gray-200 dark:border-gray-700 focus:border-blue-500 outline-none transition-all font-mono text-sm dark:text-white" value={settings.sheetId} onChange={(e) => setSettings({...settings, sheetId: e.target.value})} />
                    </div>
                    <div>
                      <label className="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1">{t.gasUrl}</label>
                      <input type="text" className="w-full px-4 py-3 rounded-xl bg-gray-50/50 dark:bg-gray-800/80 border border-gray-200 dark:border-gray-700 focus:border-blue-500 outline-none transition-all font-mono text-sm dark:text-white" value={settings.gasUrl} onChange={(e) => setSettings({...settings, gasUrl: e.target.value})} />
                    </div>
                    <div className="pt-6 border-t border-gray-100 dark:border-gray-700 flex flex-col sm:flex-row items-center justify-between gap-4">
                      <div className="flex items-center gap-2">
                        <div className={`w-3 h-3 rounded-full ${settings.isConnected ? 'bg-green-500' : 'bg-gray-300 dark:bg-gray-600'}`}></div>
                        <span className="text-sm font-semibold text-gray-600 dark:text-gray-300">{settings.isConnected ? t.connected : t.notConnected}</span>
                      </div>
                      <button onClick={handleConnectSettings} disabled={isLoading || !settings.sheetId || !settings.gasUrl} className={`w-full sm:w-auto px-6 py-2.5 rounded-full font-semibold transition-all ${(!settings.sheetId || !settings.gasUrl) ? 'bg-gray-200 dark:bg-gray-700 text-gray-400 cursor-not-allowed' : 'bg-[#0071E3] text-white hover:bg-blue-600 shadow-md shadow-blue-500/20 active:scale-95'}`}>
                        {settings.isConnected ? t.updateConn : t.connectBtn}
                      </button>
                    </div>
                  </div>
                </GlassCard>
              )}

            </div>
          </main>

          {view === 'tasks' && !showTaskForm && settings.isConnected && (
            <button onClick={() => { setNewTask({ title: '', description: '', status: 'To Do', workspace_id: workspaces[0]?.id || '', due_date: '', subtasks: [] }); setIsEditing(false); setShowTaskForm(true); }} className="md:hidden fixed bottom-24 right-6 w-14 h-14 bg-[#0071E3] text-white rounded-full flex items-center justify-center shadow-lg shadow-blue-500/30 z-20 active:scale-90 transition-transform">
              <Icons.Plus />
            </button>
          )}

          {/* New/Edit Task Modal with Subtasks */}
          {showTaskForm && (
            <div className="fixed inset-0 bg-black/20 dark:bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-fade-in overflow-y-auto">
              <GlassCard className="w-full max-w-2xl p-6 bg-white/95 dark:bg-gray-800/95 max-h-[90vh] flex flex-col">
                <h2 className="text-2xl font-bold mb-4 shrink-0">{isEditing ? t.editTask : t.newTask}</h2>
                <form onSubmit={handleSaveTask} className="space-y-4 overflow-y-auto pr-2 pb-4 flex-1 custom-scrollbar">
                  <div>
                    <label className="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1">{t.taskName}</label>
                    <input type="text" required autoFocus className="w-full px-4 py-2 rounded-xl bg-white dark:bg-gray-700 border border-gray-200 dark:border-gray-600 focus:border-blue-500 outline-none font-sans dark:text-white" value={newTask.title} onChange={e => setNewTask({...newTask, title: e.target.value})} />
                  </div>
                  <div>
                    <label className="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1">{t.desc}</label>
                    <textarea rows="2" className="w-full px-4 py-2 rounded-xl bg-white dark:bg-gray-700 border border-gray-200 dark:border-gray-600 focus:border-blue-500 outline-none resize-none font-sans dark:text-white" value={newTask.description} onChange={e => setNewTask({...newTask, description: e.target.value})} />
                  </div>
                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1">{t.workspaces}</label>
                      <select required className="w-full px-4 py-2 rounded-xl bg-white dark:bg-gray-700 border border-gray-200 dark:border-gray-600 focus:border-blue-500 outline-none font-sans dark:text-white" value={newTask.workspace_id} onChange={e => setNewTask({...newTask, workspace_id: e.target.value})}>
                        <option value="" disabled>{t.selectWs}</option>
                        {workspaces.map(ws => <option key={ws.id} value={ws.id}>{ws.name}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1">{t.dueDate}</label>
                      <input type="date" className="w-full px-4 py-2 rounded-xl bg-white dark:bg-gray-700 border border-gray-200 dark:border-gray-600 focus:border-blue-500 outline-none font-sans dark:text-white" value={newTask.due_date} onChange={e => setNewTask({...newTask, due_date: e.target.value})} />
                    </div>
                  </div>

                  {/* Subtasks Section in Form */}
                  <div className="pt-4 border-t border-gray-100 dark:border-gray-700 mt-6">
                    <div className="flex justify-between items-center mb-3">
                      <label className="block text-sm font-bold text-gray-700 dark:text-gray-300">{t.subtasks}</label>
                      <button type="button" onClick={handleAddSubtaskForm} className="text-xs font-semibold px-3 py-1.5 rounded-lg bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 hover:bg-blue-100 transition-colors flex items-center gap-1">
                        <Icons.Plus /> {t.addSubtask}
                      </button>
                    </div>
                    
                    <div className="space-y-2">
                      {(!newTask.subtasks || newTask.subtasks.length === 0) && (
                        <p className="text-sm text-gray-400 dark:text-gray-500 italic py-2 text-center bg-gray-50 dark:bg-gray-800/50 rounded-xl">ไม่มีงานย่อย</p>
                      )}
                      {(newTask.subtasks || []).map((st) => (
                        <div key={st.id} className="flex flex-col sm:flex-row gap-2 bg-gray-50 dark:bg-gray-800/80 p-3 rounded-xl border border-gray-100 dark:border-gray-700 items-start sm:items-center">
                          <input type="text" placeholder="ชื่องานย่อย..." className="flex-1 w-full sm:w-auto px-3 py-1.5 rounded-lg bg-white dark:bg-gray-700 border border-gray-200 dark:border-gray-600 outline-none text-sm dark:text-white focus:border-blue-500" value={st.title} onChange={(e) => handleSubtaskChange(st.id, 'title', e.target.value)} />
                          <div className="flex gap-2 w-full sm:w-auto mt-2 sm:mt-0">
                            <select className="flex-1 sm:w-32 px-2 py-1.5 rounded-lg bg-white dark:bg-gray-700 border border-gray-200 dark:border-gray-600 outline-none text-xs dark:text-white" value={st.assignee} onChange={(e) => handleSubtaskChange(st.id, 'assignee', e.target.value)}>
                              <option value={user.username}>ฉัน ({user.username})</option>
                              {usersList.filter(u => u.username !== user.username).map(u => <option key={u.username} value={u.username}>{u.username}</option>)}
                            </select>
                            <select className="w-24 px-2 py-1.5 rounded-lg bg-white dark:bg-gray-700 border border-gray-200 dark:border-gray-600 outline-none text-xs dark:text-white font-medium" value={st.status} onChange={(e) => handleSubtaskChange(st.id, 'status', e.target.value)}>
                              <option value="To Do">To Do</option><option value="Done">Done</option>
                            </select>
                            <button type="button" onClick={() => handleRemoveSubtaskForm(st.id)} className="w-8 h-8 shrink-0 flex items-center justify-center rounded-lg bg-red-50 text-red-500 hover:bg-red-100 transition-colors"><Icons.Trash /></button>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>

                  <div className="flex gap-3 mt-6 pt-4 border-t border-gray-100 dark:border-gray-700 shrink-0">
                    <button type="button" onClick={() => setShowTaskForm(false)} className="flex-1 py-2.5 bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-200 rounded-xl font-semibold hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors">
                      {t.cancel}
                    </button>
                    <button type="submit" disabled={isLoading} className={`flex-1 py-2.5 text-white rounded-xl font-semibold transition-all shadow-sm ${isLoading ? 'bg-blue-400 cursor-not-allowed' : 'bg-[#0071E3] hover:bg-blue-600'}`}>
                      {isLoading ? t.checking : t.saveTask}
                    </button>
                  </div>
                </form>
              </GlassCard>
            </div>
          )}

          {/* Workspace Modal */}
          {showWorkspaceForm && (
            <div className="fixed inset-0 bg-black/20 dark:bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-fade-in">
              <GlassCard className="w-full max-w-md p-6 bg-white/90 dark:bg-gray-800/90">
                <h2 className="text-2xl font-bold mb-6">{t.addWs}</h2>
                <form onSubmit={handleCreateWorkspace} className="space-y-4">
                  <div>
                    <label className="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1">{t.wsName}</label>
                    <input type="text" required autoFocus className="w-full px-4 py-2 rounded-xl bg-white dark:bg-gray-700 border border-gray-200 dark:border-gray-600 focus:border-blue-500 outline-none font-sans dark:text-white" value={newWorkspaceName} onChange={e => setNewWorkspaceName(e.target.value)} />
                  </div>
                  <div className="flex gap-3 mt-6 pt-4 border-t border-gray-100 dark:border-gray-700">
                    <button type="button" onClick={() => setShowWorkspaceForm(false)} className="flex-1 py-2.5 bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-200 rounded-xl font-semibold hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors">{t.cancel}</button>
                    <button type="submit" disabled={isLoading} className={`flex-1 py-2.5 text-white rounded-xl font-semibold transition-all shadow-sm ${isLoading ? 'bg-blue-400 cursor-not-allowed' : 'bg-[#0071E3] hover:bg-blue-600'}`}>{isLoading ? t.checking : t.createWsBtn}</button>
                  </div>
                </form>
              </GlassCard>
            </div>
          )}

          <nav className="md:hidden fixed bottom-0 inset-x-0 bg-white/60 dark:bg-gray-900/60 backdrop-blur-2xl border-t border-white/40 dark:border-gray-800 pb-safe z-30 shadow-[0_-8px_30px_rgb(0,0,0,0.04)]">
            <div className="flex justify-around items-center h-16 px-2">
              {[
                { id: 'dashboard', icon: Icons.Home, label: t.dashboard },
                { id: 'tasks', icon: Icons.CheckSquare, label: t.tasks },
                { id: 'workspaces', icon: Icons.Folder, label: t.workspacesBtn },
                ...(user.role === 'admin' ? [
                  { id: 'users', icon: Icons.UserGroup, label: t.usersBtn },
                  { id: 'settings', icon: Icons.Settings, label: t.settingsBtn }
                ] : [])
              ].map(item => (
                <button
                  key={item.id}
                  onClick={() => setView(item.id)}
                  className={`flex flex-col items-center justify-center w-full h-full space-y-1 transition-colors ${view === item.id ? 'text-[#0071E3] dark:text-blue-400' : 'text-gray-400 hover:text-gray-600 dark:hover:text-gray-300'}`}
                >
                  <item.icon />
                  <span className="text-[10px] font-semibold">{item.label}</span>
                </button>
              ))}
            </div>

          <style dangerouslySetInnerHTML={{__html: `

          `}} />
        </div>
      );
    }
